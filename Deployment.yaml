apiVersion: apps/v1
kind: Deployment
metadata:
  name: clock-app
spec:
  replicas: 3
  selector:
    matchLabels:
      model: clock
  template:
    metadata:
      labels:
        model: clock
    spec:
      containers:
        - name: clock-application
          image: devop93/time-app:test-latest
          ports:
            - containerPort: 5000

